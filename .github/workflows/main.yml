name: APK epites
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Google kapcsolat titkainak ellenorzese
        shell: bash
        env:
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          GOOGLE_SHARED_KEY: ${{ secrets.GOOGLE_SHARED_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          url = os.environ.get('GOOGLE_WEBAPP_URL', '')
          key = os.environ.get('GOOGLE_SHARED_KEY', '')
          p = urllib.parse.urlsplit(url)
          if not url or not key:
              print('::notice::A Google kapcsolat titkai még nincsenek beállítva.')
          elif p.scheme != 'https' or p.hostname != 'script.google.com' or not p.path.startswith('/macros/s/') or not p.path.endswith('/exec'):
              raise SystemExit('A Google webalkalmazás címének formátuma érvénytelen.')
          else:
              print('A Google kapcsolat titkai elérhetők.')
          PY
      - name: www mappa elokeszitese
        run: mkdir -p www && cp index.html xlsx.full.min.js www/
      - name: Android idomero teszt
        run: |
          node test/android-timer.cjs
          node test/android-finish.cjs
          node test/android-queue.cjs
          mkdir -p build-sensor-test
          javac -d build-sensor-test SensorResponseValidator.java test/SensorResponseValidatorTest.java
          java -cp build-sensor-test hu.eredmenytablazat.app.SensorResponseValidatorTest
      - run: npm install
      - run: npx cap add android
      - name: Gradle letoltesi ido beallitasa
        run: |
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|services.gradle.org/distributions/gradle-8.2.1-all.zip|mirror.math.princeton.edu/pub/macports/distfiles/gradle/gradle-8.2.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/^distributionSha256Sum=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'distributionSha256Sum=03ec176d388f2aa99defcadc3ac6adf8dd2bce5145a129659537c0874dea5ad1' >> android/gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties
      - name: Engedelyezzuk az ESP helyi kapcsolatot
        run: |
          mkdir -p android/app/src/main/res/xml
          cp network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.ACCESS_NETWORK_STATE' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application', 1)
          if '<application' not in text:
              raise RuntimeError('Az Android application elem nem talalhato')
          text = text.replace('<application', '<application android:networkSecurityConfig="@xml/network_security_config"', 1)
          manifest.write_text(text, encoding='utf-8')
          PY
      - name: Hatterbeli szinkron fuggoseg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          text = p.read_text(encoding="utf-8")
          if "dependencies {" not in text:
              raise RuntimeError("Gradle dependencies block not found")
          text = text.replace("dependencies {", "dependencies {\n    implementation \"androidx.work:work-runtime:2.9.1\"", 1)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Mento kod beepitese
        run: |
          D=$(dirname $(find android/app/src/main/java -name MainActivity.java))
          cp MainActivity.java JpegSaverPlugin.java GoogleSyncPlugin.java ArduinoSensorPlugin.java SensorResponseValidator.java "$D/"
      - name: Ikon es nev
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --break-system-packages pillow
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Eredmény beíró</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">Eredmény beíró</string>#' android/app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from PIL import Image
          import os
          res = 'android/app/src/main/res'
          src = Image.open('logo.png').convert('RGB')
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              im.save(f'{p}/ic_launcher.png')
              im.save(f'{p}/ic_launcher_round.png')
          for d, s in {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              c = Image.new('RGB', (s, s), (0, 0, 0))
              k = int(s * 0.72)
              c.paste(src.resize((k, k), Image.LANCZOS), ((s - k) // 2, (s - k) // 2))
              c.save(f'{p}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          x = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(x)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          PY
      - run: npx cap sync android
      - name: Debug APK epitese
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Eredmenytablazat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

